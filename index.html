<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Met</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: 2.4rem;
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }

  .subtitle {
    color: #888;
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }

  .progress {
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
  }

  .mode-select {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .mode-btn {
    padding: 1.2rem 2.5rem;
    font-size: 1.1rem;
    background: #181818;
    color: #ccc;
    border: 2px solid #333;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .mode-btn:hover {
    border-color: #e74c3c;
    color: #fff;
    background: #1a1a1a;
  }

  .mode-btn small {
    display: block;
    color: #666;
    font-size: 0.8rem;
    margin-top: 0.4rem;
  }

  .arena {
    display: none;
    gap: 2rem;
    align-items: center;
    justify-content: center;
  }

  .card {
    cursor: pointer;
    border: 3px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    background: #151515;
  }

  .card:hover {
    transform: scale(1.03);
    border-color: #e74c3c;
    box-shadow: 0 0 30px rgba(231, 76, 60, 0.3);
  }

  .card img {
    display: block;
    width: 420px;
    height: 560px;
    object-fit: cover;
  }

  .vs {
    font-size: 1.8rem;
    font-weight: 700;
    color: #e74c3c;
  }

  .winner-screen {
    display: none;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 3rem;
  }

  .winner-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .winner-left h2 {
    font-size: 2rem;
    margin-bottom: 1rem;
    color: #e74c3c;
  }

  .winner-left img {
    width: 400px;
    height: 540px;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid #e74c3c;
    box-shadow: 0 0 40px rgba(231, 76, 60, 0.4);
  }

  .winner-name {
    margin-top: 0.8rem;
    font-size: 1.3rem;
    color: #ccc;
  }

  .btn-row {
    display: flex;
    gap: 1rem;
    margin-top: 1.2rem;
  }

  button {
    padding: 0.7rem 1.8rem;
    font-size: 0.95rem;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #c0392b; }

  .btn-secondary {
    background: #333;
  }

  .btn-secondary:hover { background: #444; }

  .back-btn {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    background: #222;
    border: 1px solid #333;
    color: #aaa;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    margin: 0;
  }

  .back-btn:hover { background: #333; color: #fff; }
  .back-btn:disabled { opacity: 0.3; cursor: default; }
  .back-btn:disabled:hover { background: #222; color: #aaa; }

  .setup-msg {
    color: #666;
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.8;
  }

  .card-label {
    text-align: center;
    padding: 0.6rem;
    font-size: 0.9rem;
    color: #aaa;
    background: #151515;
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .winner-right {
    display: flex;
    flex-direction: column;
    min-width: 280px;
    max-width: 320px;
  }

  .winner-right h3 {
    font-size: 1.2rem;
    margin-bottom: 1rem;
    color: #888;
    text-align: center;
  }

  .rank-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid #1a1a1a;
  }

  .rank-pos {
    font-size: 1.1rem;
    font-weight: 700;
    color: #e74c3c;
    width: 2rem;
    text-align: center;
    flex-shrink: 0;
  }

  .rank-pos.gold { color: #f1c40f; }
  .rank-pos.silver { color: #bdc3c7; }
  .rank-pos.bronze { color: #e67e22; }

  .rank-thumb {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .rank-name {
    flex: 1;
    font-size: 0.9rem;
    color: #ccc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rank-wins {
    font-size: 0.8rem;
    color: #666;
    flex-shrink: 0;
  }

  .share-row {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.2rem;
    justify-content: center;
  }

  .share-btn {
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    background: #222;
    color: #ccc;
    border: 1px solid #333;
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }

  .share-btn:hover { background: #333; color: #fff; }

  @media (max-width: 900px) {
    .winner-screen { flex-direction: column; align-items: center; }
    .winner-right { margin-top: 1.5rem; }
  }

  @media (max-width: 700px) {
    .arena { flex-direction: column; gap: 1rem; }
    .card img { width: 300px; height: 400px; }
    .vs { font-size: 1.4rem; }
    .mode-select { flex-direction: column; }
  }
</style>
</head>
<body>

<button class="back-btn" id="back-btn" onclick="goBack()" disabled style="display:none">← Undo</button>

<h1>Check Met</h1>
<p class="subtitle">Pick your favorite. Last one standing wins.</p>
<p class="progress" id="progress"></p>

<div id="mode-screen">
  <div class="mode-select">
    <div class="mode-btn" onclick="startGame('quick')">
      Quick
      <small>50 images · ~49 rounds</small>
    </div>
    <div class="mode-btn" onclick="startGame('full')">
      Full
      <small id="full-count">All images</small>
    </div>
  </div>
</div>

<div class="arena" id="arena"></div>

<div class="winner-screen" id="winner-screen">
  <div class="winner-left">
    <h2>Winner!</h2>
    <img id="winner-img" src="" alt="Winner">
    <p class="winner-name" id="winner-name"></p>
    <div class="btn-row">
      <button class="btn-secondary" onclick="goBack()">← Undo</button>
      <button onclick="showModeScreen()">Play Again</button>
    </div>
  </div>
  <div class="winner-right" id="rankings"></div>
</div>

<script>
  let ALL_IMAGES = [];
  let gameImages = [];
  let pool = [];
  let current = null;
  let history = [];
  let roundSurvived = {};
  let mode = 'full';

  function prettifyName(filename) {
    return filename
      .replace(/\.[^.]+$/, '')
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  async function loadImages() {
    try {
      const resp = await fetch('images.json');
      ALL_IMAGES = await resp.json();
    } catch (e) {}

    if (ALL_IMAGES.length < 2) {
      document.getElementById('mode-screen').innerHTML =
        '<p class="setup-msg">Could not load images. Make sure <code>images.json</code> exists.</p>';
      return;
    }

    document.getElementById('full-count').textContent =
      `${ALL_IMAGES.length} images · ${ALL_IMAGES.length - 1} rounds`;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function startGame(selectedMode) {
    mode = selectedMode;

    if (mode === 'quick') {
      const shuffled = [...ALL_IMAGES];
      shuffle(shuffled);
      gameImages = shuffled.slice(0, 50);
    } else {
      gameImages = [...ALL_IMAGES];
    }

    pool = [...gameImages];
    shuffle(pool);
    current = null;
    history = [];
    roundSurvived = {};
    gameImages.forEach(img => roundSurvived[img] = 0);

    document.getElementById('mode-screen').style.display = 'none';
    document.getElementById('winner-screen').style.display = 'none';
    document.getElementById('arena').style.display = 'flex';
    document.getElementById('back-btn').style.display = '';
    updateBackBtn();
    nextRound();
  }

  function showModeScreen() {
    document.getElementById('arena').style.display = 'none';
    document.getElementById('winner-screen').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('mode-screen').style.display = '';
    document.getElementById('progress').textContent = '';
  }

  function nextRound() {
    if (pool.length === 0 && current) {
      showWinner(current);
      return;
    }

    if (!current) {
      current = pool.pop();
    }

    const challenger = pool.pop();
    updateProgress();
    renderMatchup(current, challenger);
  }

  function updateProgress() {
    const remaining = pool.length + 2;
    const total = gameImages.length;
    const eliminated = total - remaining;
    const round = history.length + 1;
    document.getElementById('progress').textContent =
      `Round ${round} · ${remaining} remaining · ${eliminated} eliminated`;
  }

  function renderMatchup(a, b) {
    const arena = document.getElementById('arena');
    arena.innerHTML = `
      <div class="card" onclick="pick('${esc(a)}', '${esc(b)}')">
        <img src="images/${encodeURIComponent(a)}" alt="${esc(a)}">
        <div class="card-label">${prettifyName(a)}</div>
      </div>
      <div class="vs">VS</div>
      <div class="card" onclick="pick('${esc(b)}', '${esc(a)}')">
        <img src="images/${encodeURIComponent(b)}" alt="${esc(b)}">
        <div class="card-label">${prettifyName(b)}</div>
      </div>
    `;
  }

  function esc(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function pick(winner, loser) {
    history.push({
      current: current,
      pool: [...pool],
      winner: winner,
      loser: loser,
      roundSurvived: { ...roundSurvived }
    });

    roundSurvived[winner] = (roundSurvived[winner] || 0) + 1;
    current = winner;
    updateBackBtn();
    nextRound();
  }

  function goBack() {
    if (history.length === 0) return;

    const prev = history.pop();
    current = prev.current;
    pool = prev.pool;
    roundSurvived = prev.roundSurvived;

    document.getElementById('winner-screen').style.display = 'none';
    document.getElementById('arena').style.display = 'flex';

    updateBackBtn();
    updateProgress();
    renderMatchup(prev.winner, prev.loser);
  }

  function updateBackBtn() {
    document.getElementById('back-btn').disabled = history.length === 0;
  }

  function showWinner(img) {
    document.getElementById('arena').style.display = 'none';
    document.getElementById('back-btn').style.display = '';
    const screen = document.getElementById('winner-screen');
    screen.style.display = 'flex';
    document.getElementById('winner-img').src = 'images/' + encodeURIComponent(img);
    document.getElementById('winner-name').textContent = prettifyName(img);
    document.getElementById('progress').textContent = '';

    showRankings(img);
  }

  function showRankings(winner) {
    const topN = mode === 'quick' ? 5 : 10;

    const ranked = gameImages
      .map(img => ({
        img,
        wins: img === winner ? (roundSurvived[img] || 0) + 1 : roundSurvived[img] || 0
      }))
      .sort((a, b) => {
        if (a.img === winner) return -1;
        if (b.img === winner) return 1;
        return b.wins - a.wins;
      })
      .slice(0, topN);

    const container = document.getElementById('rankings');
    let html = `<h3>Top ${topN}</h3>`;

    ranked.forEach((entry, i) => {
      const pos = i + 1;
      let posClass = '';
      if (pos === 1) posClass = 'gold';
      else if (pos === 2) posClass = 'silver';
      else if (pos === 3) posClass = 'bronze';

      html += `
        <div class="rank-item">
          <div class="rank-pos ${posClass}">#${pos}</div>
          <img class="rank-thumb" src="images/${encodeURIComponent(entry.img)}" alt="">
          <div class="rank-name">${prettifyName(entry.img)}</div>
          <div class="rank-wins">${pos === 1 ? '👑 Winner' : entry.wins + ' win' + (entry.wins !== 1 ? 's' : '')}</div>
        </div>
      `;
    });

    const shareText = encodeURIComponent(`My Check Met winner: ${prettifyName(winner)}! 🏆\nhttps://vvksh.github.io/metornot`);
    html += `
      <div class="share-row">
        <a href="https://twitter.com/intent/tweet?text=${shareText}" target="_blank" class="share-btn">Share on 𝕏</a>
        <a href="https://www.instagram.com/" target="_blank" class="share-btn">Share on IG</a>
      </div>
    `;

    container.innerHTML = html;
  }

  loadImages();
</script>

</body>
</html>
